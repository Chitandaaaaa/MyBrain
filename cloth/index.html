<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>服装品类归档 · 学习库</title>
<style>
  :root {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --ink: #1f2329;
    --sub: #6b7280;
    --line: #e6e8eb;
    --brand: #2f5bea;
    --brand-soft: #eef2ff;
    --chip: #f0f2f5;
    --chip-on: #2f5bea;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: var(--bg); color: var(--ink); line-height: 1.6;
  }
  header { background: linear-gradient(120deg, #2f5bea, #5b8def); color: #fff; padding: 24px 28px; }
  header h1 { font-size: 22px; font-weight: 700; }
  header p { margin-top: 6px; opacity: .9; font-size: 14px; }
  .legend { margin-top: 12px; font-size: 12.5px; background: rgba(255,255,255,.15); padding: 8px 12px; border-radius: 8px; }
  .search { margin-top: 14px; }
  .search input {
    width: 100%; max-width: 460px; padding: 10px 14px; border: none; border-radius: 8px;
    font-size: 14px; outline: none;
  }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 0 28px 60px; }

  /* 分面筛选条 */
  .facets { margin: 18px 0 6px; display: flex; flex-direction: column; gap: 10px; }
  .facet-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .facet-label { font-size: 13px; color: var(--sub); min-width: 42px; font-weight: 600; }
  .fchip {
    border: 1px solid var(--line); background: var(--panel); color: var(--sub);
    font-size: 12.5px; padding: 5px 11px; border-radius: 20px; cursor: pointer; transition: .15s;
  }
  .fchip:hover { border-color: var(--brand); }
  .fchip.on { background: var(--chip-on); border-color: var(--chip-on); color: #fff; }
  .facet-reset { margin-left: auto; font-size: 12.5px; color: var(--brand); cursor: pointer; background: none; border: none; }

  .layout { display: grid; grid-template-columns: 200px 1fr; gap: 20px; margin-top: 16px; }
  nav.side { display: flex; flex-direction: column; gap: 6px; align-self: start; position: sticky; top: 16px; }
  nav.side button {
    text-align: left; padding: 11px 13px; border: 1px solid var(--line); background: var(--panel);
    border-radius: 10px; cursor: pointer; font-size: 15px; color: var(--ink); transition: .15s;
  }
  nav.side button:hover { border-color: var(--brand); }
  nav.side button.active { background: var(--brand-soft); border-color: var(--brand); color: var(--brand); font-weight: 600; }
  nav.side .en { display: block; font-size: 11px; color: var(--sub); font-weight: 400; }

  main { min-width: 0; }
  .cat-head { margin-bottom: 12px; }
  .cat-head h2 { font-size: 20px; }
  .cat-head .en { color: var(--sub); font-size: 13px; }
  .cat-head .desc { color: var(--sub); font-size: 13px; margin-top: 4px; }
  .count { color: var(--sub); font-size: 13px; margin-bottom: 12px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 16px; cursor: pointer; transition: .15s;
  }
  .card:hover { box-shadow: 0 6px 18px rgba(0,0,0,.06); transform: translateY(-2px); }
  .card .thumb {
    height: 120px; border-radius: 8px; background: var(--brand-soft);
    display: flex; align-items: center; justify-content: center; color: var(--brand);
    font-size: 13px; margin-bottom: 12px;
  }
  .card .name { font-size: 16px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
  .card .name .en { font-size: 12px; color: var(--sub); font-weight: 400; }
  .card .lead { color: var(--sub); font-size: 13px; margin-top: 6px; }
  .card .detail { display: none; margin-top: 12px; border-top: 1px dashed var(--line); padding-top: 12px; }
  .card.open .detail { display: block; }
  .kv { font-size: 13px; margin-bottom: 8px; }
  .kv b { color: var(--ink); }
  .kv span { color: var(--sub); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .chip { background: var(--chip); color: var(--sub); font-size: 12px; padding: 3px 9px; border-radius: 20px; }
  .empty { color: var(--sub); padding: 40px; text-align: center; }
  .loading { color: var(--sub); padding: 40px; text-align: center; }

  /* 移动端 */
  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; }
    nav.side { position: static; flex-direction: row; flex-wrap: wrap; }
    nav.side button { flex: 1 1 30%; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  }
  @media (max-width: 480px) {
    .wrap { padding: 0 14px 50px; }
    header { padding: 20px 16px; }
    nav.side button { flex: 1 1 45%; }
    .card .thumb { height: 96px; }
  }
</style>
</head>
<body>
<header>
  <h1>服装品类归档 · 学习库</h1>
  <p>除鞋以外的所有衣物，按「品类」归档，按「面料 / 长度 / 风格 / 季节」横切筛选，随时查阅、系统学习。</p>
  <div class="legend">💡 分类逻辑：<b>品类</b>决定"这是什么衣服"（左导航），<b>属性</b>描述"它长什么样 / 什么材质"（上方筛选）。例如：外套 + 羊毛呢 + 长款 = 呢子大衣。</div>
  <div class="search"><input id="q" type="text" placeholder="搜索品类，如：大衣 / 夹克 / 卫衣 …" /></div>
</header>

<div class="wrap">
  <div class="facets" id="facets"></div>
  <div class="layout">
    <nav class="side" id="nav"></nav>
    <main id="main"><div class="loading">加载分类数据中…</div></main>
  </div>
</div>

<script>
/* ============================================================
   单一事实来源：data/categories.json（与 ai-match.mjs、requirements.md 共用）
   每个子类除品类归属外，额外带 4 个横切属性（facet）：
   fabric 面料 / length 长度 / style 风格 / season 季节
   长度取值受控词表：短款 / 常规 / 长款 / 超长款
============================================================ */
let CATEGORIES = [];

/* 分面维度定义（选项从数据中动态汇总） */
const FACET_DEFS = [
  { key: "fabric", label: "面料" },
  { key: "length", label: "长度" },
  { key: "style",  label: "风格" },
  { key: "season", label: "季节" }
];
function collect(key) {
  const s = new Set();
  CATEGORIES.forEach(c => c.items.forEach(it => (it[key] || []).forEach(v => s.add(v))));
  return [...s];
}

/* 状态 */
const state = { cat: null, q: "", facets: {} };
FACET_DEFS.forEach(f => state.facets[f.key] = new Set());

/* 渲染：分面筛选条 */
const facetsEl = document.getElementById('facets');
function renderFacets() {
  facetsEl.innerHTML = FACET_DEFS.map(f => {
    const opts = collect(f.key);
    const chips = opts.map(o =>
      `<span class="fchip ${state.facets[f.key].has(o) ? 'on' : ''}" data-k="${f.key}" data-v="${o}">${o}</span>`).join('');
    return `<div class="facet-row"><span class="facet-label">${f.label}</span>${chips}
      ${state.facets[f.key].size ? `<button class="facet-reset" data-clear="${f.key}">清除</button>` : ''}</div>`;
  }).join('');
  facetsEl.querySelectorAll('.fchip').forEach(c => c.onclick = () => {
    const k = c.dataset.k, v = c.dataset.v, set = state.facets[k];
    set.has(v) ? set.delete(v) : set.add(v); renderFacets(); renderMain();
  });
  facetsEl.querySelectorAll('.facet-reset').forEach(b => b.onclick = () => {
    state.facets[b.dataset.clear].clear(); renderFacets(); renderMain();
  });
}

/* 渲染：左侧导航 */
const nav = document.getElementById('nav');
const main = document.getElementById('main');
const qEl = document.getElementById('q');
function renderNav() {
  nav.innerHTML = CATEGORIES.map(c =>
    `<button data-cat="${c.cat}" class="${c.cat === state.cat ? 'active' : ''}">${c.cat}<span class="en">${c.en}</span></button>`).join('');
  nav.querySelectorAll('button').forEach(b => b.onclick = () => { state.cat = b.dataset.cat; renderNav(); renderMain(); });
}

/* 过滤逻辑 */
function passFacets(it) {
  return FACET_DEFS.every(f => {
    const sel = state.facets[f.key];
    if (!sel.size) return true;
    return (it[f.key] || []).some(v => sel.has(v)); // 维度内 OR，维度间 AND
  });
}
function cardHTML(it) {
  const chips = [["面料", it.fabric], ["长度", it.length], ["风格", it.style], ["季节", it.season]]
    .filter(([, a]) => a && a.length)
    .map(([l, a]) => `<div class="kv"><b>${l}：</b><span class="chips">${a.map(x => `<span class="chip">${x}</span>`).join('')}</span></div>`).join('');
  return `<div class="card" onclick="this.classList.toggle('open')">
    <div class="thumb">${it.name}<br><span style="font-size:11px;opacity:.7">（配图位）</span></div>
    <div class="name">${it.name}<span class="en">${it.en}</span></div>
    <div class="lead">${it.lead}</div>
    <div class="detail">
      <div class="kv"><b>定义：</b><span>${it.def}</span></div>
      <div class="kv"><b>核心特点：</b><span>${it.features}</span></div>
      ${chips}
    </div>
  </div>`;
}
function renderMain() {
  const kw = state.q.trim().toLowerCase();
  const cat = CATEGORIES.find(c => c.cat === state.cat);
  if (!cat) { main.innerHTML = `<div class="empty">分类数据未加载。</div>`; return; }
  const items = cat.items.filter(it =>
    passFacets(it) &&
    (!kw || it.name.toLowerCase().includes(kw) || it.en.toLowerCase().includes(kw) || it.lead.toLowerCase().includes(kw)));
  const activeF = FACET_DEFS.filter(f => state.facets[f.key].size).map(f => [...state.facets[f.key]].join('/')).join(' · ');
  if (!items.length) { main.innerHTML = `<div class="empty">当前筛选（${activeF || '无'}）下没有匹配的品类。</div>`; return; }
  main.innerHTML = `
    <div class="cat-head"><h2>${cat.cat} <span class="en">${cat.en}</span></h2><div class="desc">${cat.desc}</div></div>
    <div class="count">共 ${items.length} 个子类${activeF ? ` · 已筛选：${activeF}` : ''}</div>
    <div class="grid">${items.map(cardHTML).join('')}</div>`;
}

qEl.oninput = e => { state.q = e.target.value; renderMain(); };

/* 初始化：拉取唯一数据源 */
async function init() {
  try {
    const res = await fetch('./data/categories.json');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    CATEGORIES = await res.json();
    state.cat = CATEGORIES[0].cat;
    renderFacets(); renderNav(); renderMain();
  } catch (e) {
    main.innerHTML = `<div class="empty">分类数据加载失败：${e.message}<br>请通过本地服务器打开（如 <code>python3 -m http.server</code>），不要用 file:// 直接打开。</div>`;
  }
}
init();
</script>
</body>
</html>
